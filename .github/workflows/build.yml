name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - run: pip install setuptools
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest
